{% extends "base.html" %}

{% block content %}

<section class="compartir-experiencia">

    <div class="container">

        <h2 class="titulo-neon">
            COMPARTÍ TU EXPERIENCIA
        </h2>

        <p class="compartir-intro">
            Queremos conocer cómo viviste tu noche con
            <strong>El Mamadera</strong>.
        </p>


        <div class="formulario-experiencia">

            <form
                action="{{ url_for('compartir_experiencia', tipo_evento=tipo_evento) }}"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- NOMBRE -->

                <div class="campo">

                    <label for="nombre">
                        Tu nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Juan"
                        required
                    >

                </div>


                <!-- COMENTARIO -->

                <div class="campo">

                    <label for="comentario">
                        Contanos tu experiencia
                    </label>

                    <textarea
                        id="comentario"
                        name="comentario"
                        rows="5"
                        placeholder="¿Cómo fue tu experiencia con El Mamadera?"
                        required
                    ></textarea>

                </div>


                <!-- FOTO -->

                <div class="campo">

                    <label for="foto">
                        Compartí una foto de la noche
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                        required
                        style="
                            display: block !important;
                            width: 100%;
                            padding: 15px;
                            background: #111111;
                            color: white;
                            border: 1px solid #d4af37;
                            border-radius: 10px;
                            cursor: pointer;
                            font-family: Poppins, sans-serif;
                        "
                    >

                    <small>
                        Podés subir una foto de tu evento.
                    </small>

                </div>


                <!-- AVISO -->

                <div class="aviso-experiencia">

                    <i class="fa-solid fa-circle-info"></i>

                    <p>
                        Tu experiencia será revisada antes de aparecer
                        públicamente en nuestra página.
                    </p>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-principal btn-enviar"
                >
                    📸 Publicar experiencia
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
