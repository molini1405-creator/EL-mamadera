{% extends "base.html" %}

{% block content %}

<section class="compartir-experiencia">

    <div class="container">

        <h2 class="titulo-neon">
            COMPARTÍ TU EXPERIENCIA
        </h2>

        <p class="compartir-intro">
            Queremos conocer cómo viviste tu noche con
            <strong>El Mamadera</strong>.
        </p>


        <div class="formulario-experiencia">

            <form
                action="{{ url_for('compartir_experiencia', tipo_evento=tipo_evento) }}"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- NOMBRE -->

                <div class="campo">

                    <label for="nombre">
                        Tu nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Juan"
                        required
                    >

                </div>


                <!-- COMENTARIO -->

                <div class="campo">

                    <label for="comentario">
                        Contanos tu experiencia
                    </label>

                    <textarea
                        id="comentario"
                        name="comentario"
                        rows="5"
                        placeholder="¿Cómo fue tu experiencia con El Mamadera?"
                        required
                    ></textarea>

                </div>


                <!-- FOTO -->

                <div class="campo">

                    <label>
                        Compartí una foto de la noche
                    </label>

                    <label for="foto" class="selector-foto">

                        <i class="fa-solid fa-camera"></i>

                        <span id="nombre-foto">
                            Seleccionar una foto
                        </span>

                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                        required
                        hidden
                    >

                    <small>
                        JPG, PNG o WEBP
                    </small>

                </div>


                <!-- AVISO -->

                <div class="aviso-experiencia">

                    <i class="fa-solid fa-circle-info"></i>

                    <p>
                        Tu experiencia será revisada antes de aparecer
                        públicamente en nuestra página.
                    </p>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-principal btn-enviar"
                >

                    📸 Publicar experiencia

                </button>

            </form>

        </div>

    </div>

</section>


<!-- MOSTRAR NOMBRE DEL ARCHIVO -->

<script>

    const inputFoto = document.getElementById("foto");
    const nombreFoto = document.getElementById("nombre-foto");

    inputFoto.addEventListener("change", function () {

        if (this.files.length > 0) {

            nombreFoto.textContent = this.files[0].name;

        } else {

            nombreFoto.textContent = "Seleccionar una foto";

        }

    });

</script>

{% endblock %}
