{% extends "base.html" %}

{% block content %}

<section class="admin-login">

    <div class="admin-login-box">

        <h1 class="titulo-neon">
            ADMINISTRACIÓN
        </h1>

        <p>
            Ingresá la contraseña para continuar.
        </p>

        {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            <div class="campo-admin">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá tu contraseña"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-principal"
            >
                🔐 Ingresar
            </button>

        </form>

    </div>

</section>

{% endblock %}
