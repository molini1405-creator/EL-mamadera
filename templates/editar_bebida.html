{% extends "base.html" %}

{% block content %}

<section class="admin-panel">

    <div class="container">

        <h1 class="titulo-neon">
            EDITAR BEBIDA
        </h1>

        <div class="form-admin">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="campo-admin">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        value="{{ bebida.nombre }}"
                        required
                    >

                </div>


                <div class="campo-admin">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        required
                    >{{ bebida.descripcion }}</textarea>

                </div>


                <div class="campo-admin">

                    <label for="categoria">
                        Categoría
                    </label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >

                        <option value="cocteles"
                            {% if bebida.categoria == "cocteles" %}selected{% endif %}>
                            Cócteles
                        </option>

                        <option value="aperitivos"
                            {% if bebida.categoria == "aperitivos" %}selected{% endif %}>
                            Aperitivos
                        </option>

                        <option value="cervezas"
                            {% if bebida.categoria == "cervezas" %}selected{% endif %}>
                            Cervezas
                        </option>

                        <option value="gaseosas"
                            {% if bebida.categoria == "gaseosas" %}selected{% endif %}>
                            Gaseosas
                        </option>

                        <option value="sin-alcohol"
                            {% if bebida.categoria == "sin-alcohol" %}selected{% endif %}>
                            Sin alcohol
                        </option>

                    </select>

                </div>


                <!-- FOTO ACTUAL -->

                {% if bebida.imagen %}

                <div class="foto-actual">

                    <label>
                        Foto actual
                    </label>

                    <img
                        src="{{ bebida.imagen }}"
                        alt="{{ bebida.nombre }}"
                    >

                </div>

                {% endif %}


                <!-- NUEVA FOTO -->

                <div class="campo-admin">

                    <label for="foto">
                        Cambiar foto
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                    >

                    <small>
                        Si no seleccionás ninguna imagen,
                        se conservará la foto actual.
                    </small>

                </div>


                <div class="admin-form-botones">

                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        💾 Guardar cambios
                    </button>

                    <a
                        href="{{ url_for('admin') }}"
                        class="btn-editar"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
