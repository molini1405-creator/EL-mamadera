{% extends "base.html" %}

{% block content %}

<section class="admin-panel">

    <div class="container">

        <h1 class="titulo-neon">
            AGREGAR BEBIDA
        </h1>

        <div class="form-admin">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="campo-admin">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Negroni"
                        required
                    >

                </div>


                <div class="campo-admin">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        placeholder="Descripción de la bebida"
                        required
                    ></textarea>

                </div>


                <div class="campo-admin">

                    <label for="categoria">
                        Categoría
                    </label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >

                        <option value="">
                            Seleccionar categoría
                        </option>

                        <option value="cocteles">
                            Cócteles
                        </option>

                        <option value="aperitivos">
                            Aperitivos
                        </option>

                        <option value="cervezas">
                            Cervezas
                        </option>

                        <option value="gaseosas">
                            Gaseosas
                        </option>

                        <option value="sin-alcohol">
                            Sin alcohol
                        </option>

                    </select>

                </div>


                <div class="campo-admin">

                    <label for="foto">
                        Foto de la bebida
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                    >

                    <small>
                        Podés seleccionar una imagen desde tu computadora o celular.
                    </small>

                </div>


                <div class="admin-form-botones">

                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        ➕ Agregar bebida
                    </button>

                    <a
                        href="{{ url_for('admin') }}"
                        class="btn-editar"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
