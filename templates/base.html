<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Mamadera | Bebidas & Barras Móviles</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const botones = document.querySelectorAll(".categoria-btn");
    const tragos = document.querySelectorAll(".trago-item");


    botones.forEach(function (boton) {

        boton.addEventListener("click", function () {

            const categoria = this.dataset.categoria;


            /* BOTÓN ACTIVO */

            botones.forEach(function (btn) {

                btn.classList.remove("activo");

            });

            this.classList.add("activo");


            /* FILTRAR */

            tragos.forEach(function (trago) {

                const categorias =
                    trago.dataset.categorias.split(" ");


                if (
                    categoria === "todos" ||
                    categorias.includes(categoria)
                ) {

                    trago.classList.remove("oculto");

                } else {

                    trago.classList.add("oculto");

                }

            });

        });

    });

});

</script>

<body>

    {% block content %}{% endblock %}

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript propio -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
